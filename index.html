<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <title>Flower-Market</title>
  </head>
  <body>
    <header>
      <nav class="flex items-center justify-around mt-[30px] mb-[120px]">
        <div>
          <img src="assets/logo.png" alt="" />
        </div>

        <div>
          <ul class="flex gap-12">
            <li class="text-[#252432]"><a href="">Home</a></li>
            <li class="text-[#8987A1]"><a href="">Shop</a></li>
            <li class="text-[#8987A1]"><a href="">About Us</a></li>
            <li class="text-[#000000]"><a href=""></a>Card</li>
          </ul>
        </div>
      </nav>

      <div class="flex lg:flex-2 md:flex-1 sm:flex-1 items-center justify-around max-w-[1140px] m-auto">
        <div class="max-w-[570px]">
          <h3 class="text-[#000000] text-[65px]">ALWAYS <span class="text-[#E95A08]">FRESH FLOWERS</span></h3>
          <p class="text-[#8987A1] text-[22px]">
            Indulge your senses with the beauty and fragrance of our fresh
            flower shop. From classic roses to exotic blooms, we offer a wide

          </p>

        <div class="img">
            <img src="/assets/hero-flower.png" alt="">
        </div>
      </div>
